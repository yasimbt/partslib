name: capacitor
prefix: CAP
identity: params
library: PL_Capacitor            # generated symbol library; never rename
value: "{capacitance_f}F"
description: "{capacitance_f} {tolerance_pct} {voltage_v} {dielectric} MLCC, {package}"   # suggested for new parts
defaults:                 # filled in on the new-part form; still checked before release
  symbol: Device:C
  packages:
    "0603": {footprint: "Capacitor_SMD:C_0603_1608Metric", model: "Capacitor_SMD/C_0603_1608Metric.step"}
near_match: [capacitance_f, package]
params:
  capacitance_f: {kind: quantity, unit: F, identity: true}
  tolerance_pct: {kind: quantity, unit: pct, identity: true}
  voltage_v: {kind: quantity, unit: V, identity: true}
  dielectric:
    kind: choice
    identity: true
    choices: [C0G, X5R, X6S, X7R, X7S, X8R, Y5V, tantalum, aluminium, polymer, film]
    aliases: {NP0: C0G, aluminum: aluminium}
  package: {kind: text, identity: true}
