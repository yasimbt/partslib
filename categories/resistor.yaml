name: resistor
prefix: RES
identity: params
library: PL_Resistor            # generated symbol library; never rename
value: "{resistance_ohm}Ω"
description: "{resistance_ohm} {tolerance_pct} {power_w} {technology}, {package}"   # suggested for new parts
defaults:                 # filled in on the new-part form; still checked before release
  symbol: Device:R
  packages:
    "0603": {footprint: "Resistor_SMD:R_0603_1608Metric", model: "Resistor_SMD/R_0603_1608Metric.step"}
near_match: [resistance_ohm, package]
params:
  resistance_ohm: {kind: quantity, unit: ohm, identity: true}
  tolerance_pct: {kind: quantity, unit: pct, identity: true}
  power_w: {kind: quantity, unit: W, identity: true}
  voltage_v: {kind: quantity, unit: V}
  package: {kind: text, identity: true}
  technology:
    kind: choice
    identity: true
    choices: [thick_film, thin_film, metal_film, metal_foil, wirewound, carbon_film]
