[project]
name = "partslib"
version = "0.0.0"
description = "Personal single-source KiCad parts library with a local dashboard"
requires-python = ">=3.11"
dependencies = ["pyyaml", "fastapi", "uvicorn", "jinja2"]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[project.scripts]
partslib = "partslib.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/partslib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]
