[project]
name = "partslib"
version = "0.0.0"
description = "Personal single-source KiCad parts library with a local dashboard"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
partslib = "partslib.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/partslib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
